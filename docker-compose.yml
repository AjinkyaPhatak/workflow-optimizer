services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: workflow_optimizer
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d workflow_optimizer"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  temporal:
    image: temporalio/temporal:latest
    user: "0:0"
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports:
      - "127.0.0.1:57233:7233"
      - "127.0.0.1:58233:8233"
    volumes:
      - temporal-data:/data
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 30

  embeddings:
    build: workers/embeddings
    environment:
      COMPUTE_SERVICE_TOKEN: $COMPUTE_SERVICE_TOKEN
    ports:
      - "127.0.0.1:58081:8081"
    volumes:
      - embedding-models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')"]
      interval: 10s
      timeout: 5s
      retries: 30

  analysis-image:
    image: workflow-optimizer-analysis:local
    build: workers/analysis
    profiles: ["images"]

volumes:
  postgres-data:
  temporal-data:
  embedding-models:
